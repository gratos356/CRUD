<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>
<body>
    <section class="createTask">
        <form id="taskForm" class="taskInputForm">
            <input type="text" placeholder="ingrese la tarea" class="InputTitleTask" id="inputTask">
            <button type="submit" id="BttSave" class="Bttsubmit">Save</button>
        </form>
    </section>
    <section class="showTasks" id="SectionShowTasks">
        
    </section>
    <section class="updateTask" id="TaskUpdate">
        <form id="updateTaskForm" class="taskFormUpdate">
            <input type="text" class="inputUpdateTaskId inputs" id="taskInputUpdateId" placeholder="id a Actualizar">
            <input type="text" class="inputUpdateTaskTitle inputs" id="taskInputUpdateTitle" placeholder="Titulo nuevo">
            <select class="inputUpdateTaskState inputs" id="taskInputUpdateState" name="opciones">
                <option value="1">Completado</option>
                <option value="2">No Completado</option>
            </select>
            <button type="submit" class="BttnUpdate Bttsubmit" id="updateBttn">Update</button>
        </form>
    </section>
    <script src="script.js" type="module"></script>
</body>
</html>
